version: "3.8"

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: keval535
      POSTGRES_DB: travel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:latest
    container_name: travel_weaviate
    restart: always
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
    volumes:
      - weaviate_data:/var/lib/weaviate

  redis:
    image: redis:7-alpine
    container_name: travel_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    container_name: travel_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - weaviate
    environment:
      - DATABASE_URL=postgresql://postgres:keval535@postgres:5432/travel_db
      - REDIS_URL=redis://redis:6379
      - WEAVIATE_URL=http://weaviate:8080
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - PYTHONPATH=/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    


  frontend:
    build: ./frontend
    container_name: travel_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    container_name: travel_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  weaviate_data: